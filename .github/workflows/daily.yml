name: Daily Quran & Hadith

on:
  schedule:
    # Checks every 15 minutes. dispatcher.py decides if something is due,
    # so a late or extra run can never cause a double send.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Force-send now (leave empty = normal check)'
        required: false
        default: ''
        type: choice
        options: ['', quran, hadith]

# Never let two runs overlap (that was a source of double sends)
concurrency:
  group: whatsapp-bot
  cancel-in-progress: false

permissions:
  contents: write

env:
  BOT_TIMEZONE: Africa/Cairo

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Is anything due?
        id: check
        env:
          FORCED: ${{ github.event.inputs.task }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import dispatcher
          now = datetime.now(ZoneInfo(os.environ["BOT_TIMEZONE"]))
          due = dispatcher.due_tasks(now, dispatcher.load_state())
          forced = os.environ.get("FORCED", "")
          print("due:", due, "forced:", forced or "-")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if (due or forced) else 'false'}\n")
          PY

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Send
        if: steps.check.outputs.run == 'true'
        env:
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
          FORCED: ${{ github.event.inputs.task }}
        run: python dispatcher.py "$FORCED"

      - name: Save state
        if: always() && steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "Update state [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
